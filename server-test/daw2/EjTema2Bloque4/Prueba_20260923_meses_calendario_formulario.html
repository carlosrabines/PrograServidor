<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CAlendario</title>
    <link rel="stylesheet" href="../styles/styles_mes.css" />
  </head>
  <body>
    <h1>Solicita Año-Mes Calendario</h1>

    <form action="20260923_meses_calendario.php" method="post">
      <label for="id_n_anio"> Año [entre 1900 y 2030]: </label>
      <input
        type="number"
        id_numero="id_n_anio"
        name="n_anio"
        min="1900"
        max="2030"
        required
      />
      <label for="id_n_mes"> Mes [entre 1 y 12]: </label>
      <input
        type="number"
        id_nmes="id_n_anio"
        name="n_mes"
        min="1"
        max="12"
        required
      />

      <!--<br><br> -->
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
